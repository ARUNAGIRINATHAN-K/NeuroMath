[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromath"
version = "1.0.0"
authors = [
  { name = "Arunagirinathan K", email = "arunagirinathan.k@example.com" },
]
description = "The mathematical engine of neural networks, engineered from first principles in pure Python and NumPy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "neural-networks",
  "deep-learning",
  "machine-learning",
  "mathematics",
  "numpy",
  "backpropagation",
  "gradient-descent",
  "optimization",
  "loss-landscapes",
  "educational"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.21.0",
  "matplotlib>=3.4.0",
  "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
benchmarks = [
  "tensorflow>=2.8.0",
]
dev = [
  "pytest>=7.0.0",
  "jupyter>=1.0.0",
  "flake8>=6.0.0",
]

[project.urls]
"Homepage" = "https://github.com/ARUNAGIRINATHAN-K/NeuroMath"
"Bug Tracker" = "https://github.com/ARUNAGIRINATHAN-K/NeuroMath/issues"
"Discussions" = "https://github.com/ARUNAGIRINATHAN-K/NeuroMath/discussions"

